  /api/v1/managers/operations/{id}:
    get:
      operationId: getManagerOperation
      tags: [Managers]
      security:
        - managerSession: []
      summary: Read the live result of an owned manager command.
      description: >-
        Requires ownership and the current target scope. Product create and update
        receipts require catalog.manage without clients.read. Other command kinds
        retain clients.read plus their command grant. Installation review and
        legacy installation CRM retry require clients.read. Account profile,
        portrait, audit date and refresh require clients.write. Renewal requires
        clients.renew. Portrait template and niche commands require
        configuration.manage in addition to clients.read.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Live Platform operation, synchronous receipt, or unknown outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerOperation'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: The Platform request is rate limited.
          headers:
            Retry-After:
              schema: {type: string, pattern: '^[0-9]+$'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The Platform result cannot currently be read.
          headers:
            Retry-After:
              schema: {type: string, pattern: '^[0-9]+$'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
