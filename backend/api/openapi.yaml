          required: [inbox, triggers]
          properties:
            inbox: {$ref: '#/components/schemas/DistributionBacklog'}
            triggers: {$ref: '#/components/schemas/DistributionBacklog'}
        origin: {type: string, enum: [real, fixture]}
    DistributionTraceItem:
      type: object
      additionalProperties: false
      required: [kind, id, message_id, state, created_at, error_code, event_id, operation_id, correlation_id, causation_id, lead_id, result_version, external_effect_state, evidence, attempts]
      properties:
        kind: {type: string}
        message_id: {type: string, format: uuid, nullable: true}
        id: {type: string}
        state: {type: string}
        raw: {type: string}
        created_at: {type: string, format: date-time}
        error_code: {type: string, nullable: true}
        event_id: {type: string, format: uuid, nullable: true}
        operation_id: {type: string, format: uuid, nullable: true}
        correlation_id: {type: string, format: uuid, nullable: true}
        causation_id: {type: string, format: uuid, nullable: true}
        lead_id: {type: string, nullable: true}
        result_version: {type: integer, nullable: true}
        external_effect_state: {type: string, nullable: true}
        evidence: {type: string, nullable: true}
        attempts: {type: integer, nullable: true}
    DistributionTrace:
      type: object
      additionalProperties: false
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DistributionTraceItem'}
        next_cursor: {type: string, nullable: true}
        total: {type: integer, nullable: true}
    DistributionSummaryObservation:
      allOf:
        - $ref: '#/components/schemas/Observation'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/DistributionSummary'}
    DistributionTraceObservation:
      allOf:
        - $ref: '#/components/schemas/Observation'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/DistributionTrace'}

    ManagerEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - installed
          - reinstalled
          - reauthorized
          - uninstalled
          - activated
          - installation_reviewed
          - installation_unreviewed
          - account_profile_updated
          - portrait_updated
          - access_renewed
        occurred_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
        account_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        actor_display:
          type: string
        summary:
          type: string
        related_refs:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                enum:
                - account
                - product
                - installation
              id:
                type: string
                format: uuid
            required:
            - kind
            - id
      required:
      - id
      - kind
      - occurred_at
      - recorded_at
      - summary
      - related_refs
    ManagerEventList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagerEvent'
        next_cursor:
          type:
          - string
          - 'null'
        snapshot_at:
          type: string
          format: date-time
        query_hash:
          type: string
      required:
      - items
      - next_cursor
      - snapshot_at
      - query_hash

    ManagerVersion:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    ManagerCompanyProjectionId:
      type: string
      format: uuid
      description: UUID проекции CRM-компании. Не является runtime account_id.
    ManagerCompanySource:
      type: object
      additionalProperties: false
      properties:
        source_account_id:
          anyOf:
          - $ref: '#/components/schemas/ManagerAmoID'
          - type: 'null'
        binding_revision:
          anyOf:
          - type: string
          - type: 'null'
        state:
          type: string
          enum:
          - fresh
          - stale
          - error
          - disabled
        complete:
          type: boolean
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        fresh_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        error_code:
          anyOf:
          - type: string
          - type: 'null'
        retry_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - source_account_id
      - binding_revision
      - state
      - complete
      - observed_at
      - fresh_until
      - error_code
      - retry_at
      description: Времена относятся к полному поколению данных. Ошибка последней попытки не заменяет
        данные; локальное истечение переводит fresh в stale. Смена активной привязки очищает текущий
        снимок.
    ManagerCompanyRuntimeAccount:
      type: object
      additionalProperties: false
      properties:
        account_id:
          type: string
          format: uuid
        customer_account_id:
          $ref: '#/components/schemas/ManagerAmoID'
      required:
      - account_id
      - customer_account_id
    ManagerCompanySummary:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ManagerCompanyProjectionId'
        crm_company_id:
          $ref: '#/components/schemas/ManagerAmoID'
        name:
          type: string
        customer_account_ids:
          type: array
          items:
            $ref: '#/components/schemas/ManagerAmoID'
        source_resolution:
          type: string
          enum:
          - unknown
          - zero
          - one
          - multiple
        runtime_resolution:
          type: string
          enum:
          - unresolved
          - resolved
          - partial
          - ambiguous
        runtime_accounts:
          type: array
          items:
            $ref: '#/components/schemas/ManagerCompanyRuntimeAccount'
      required:
      - id
      - crm_company_id
      - name
      - customer_account_ids
      - source_resolution
      - runtime_resolution
      - runtime_accounts
    ManagerCompanyList:
      type: object
      additionalProperties: false
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceStatus'
        observation:
          type: object
          required: [source, observed_at, freshness, data]
          properties:
            source: {type: string}
            observed_at: {type: [string, 'null'], format: date-time}
            freshness: {type: string}
            data: {$ref: '#/components/schemas/ManagerCompanySource'}
            error:
              type: object
              properties:
                code: {type: string}
                message: {type: string}
        items:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/ManagerCompanySummary'
          - type: 'null'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
        source:
          $ref: '#/components/schemas/ManagerCompanySource'
      required:
      - items
      - next_cursor
      - source
      description: items=null до первого полного наблюдения; items=[] означает полный пустой каталог.
        Курсор фиксирует поколение, активацию, сотрудника, версию прав и фильтры на 15 минут.
    ManagerCompanyContactLink:
      type: object
      additionalProperties: false
      properties:
        crm_company_id:
          $ref: '#/components/schemas/ManagerAmoID'
        company_id:
          anyOf:
          - $ref: '#/components/schemas/ManagerCompanyProjectionId'
          - type: 'null'
      required:
      - crm_company_id
      - company_id
    ManagerCompanyContact:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ManagerAmoID'
        name:
          type: string
        companies:
          type: array
          items:
            $ref: '#/components/schemas/ManagerCompanyContactLink'
      required:
      - id
      - name
      - companies
    ManagerCompanyDetail:
      type: object
      additionalProperties: false
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceStatus'
        observation:
          type: object
          required: [source, observed_at, freshness, data]
          properties:
            source: {type: string}
            observed_at: {type: [string, 'null'], format: date-time}
            freshness: {type: string}
            data: {$ref: '#/components/schemas/ManagerCompanySource'}
            error:
              type: object
              properties:
                code: {type: string}
                message: {type: string}
        id:
          $ref: '#/components/schemas/ManagerCompanyProjectionId'
        crm_company_id:
          $ref: '#/components/schemas/ManagerAmoID'
        name:
          type: string
        customer_account_ids:
          type: array
          items:
            $ref: '#/components/schemas/ManagerAmoID'
        source_resolution:
          type: string
          enum:
          - unknown
          - zero
          - one
          - multiple
        runtime_resolution:
          type: string
          enum:
          - unresolved
          - resolved
          - partial
          - ambiguous
        runtime_accounts:
          type: array
          items:
            $ref: '#/components/schemas/ManagerCompanyRuntimeAccount'
        source:
          $ref: '#/components/schemas/ManagerCompanySource'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ManagerCompanyContact'
        unresolved_relations:
          type: array
          items:
            $ref: '#/components/schemas/ManagerCompanyContactLink'
      required:
      - id
      - crm_company_id
      - name
      - customer_account_ids
      - source_resolution
      - runtime_resolution
      - runtime_accounts
      - source
      - contacts
      - unresolved_relations
    ManagerCompanyWorkflowStage:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ManagerAmoID'
        name:
          type: string
      required:
      - id
      - name
    ManagerCompanyWorkflowPipeline:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ManagerAmoID'
        name:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/ManagerCompanyWorkflowStage'
      required:
      - id
      - name
      - stages
    ManagerCompanyWorkflowMetadata:
      type: object
      additionalProperties: false
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceStatus'
        observation:
          type: object
          required: [source, observed_at, freshness, data]
          properties:
            source: {type: string}
            observed_at: {type: [string, 'null'], format: date-time}
            freshness: {type: string}
            data: {$ref: '#/components/schemas/ManagerCompanySource'}
            error:
              type: object
              properties:
                code: {type: string}
                message: {type: string}
        generation_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        source:
          $ref: '#/components/schemas/ManagerCompanySource'
        pipelines:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/ManagerCompanyWorkflowPipeline'
          - type: 'null'
        required_fields_state:
          type: string
          enum:
          - unknown
        write_ready:
          type: boolean
          enum:
          - false
      required:
      - generation_id
      - source
      - pipelines
      - required_fields_state
      - write_ready
    ManagerCompanyWorkflowConfiguration:
      type: object
      additionalProperties: false
      properties:
        revision:
          $ref: '#/components/schemas/ManagerVersion'
        source_account_id:
          $ref: '#/components/schemas/ManagerAmoID'
        binding_revision:
          type: string
        metadata_generation_id:
          type: string
          format: uuid
        pipeline_id:
          $ref: '#/components/schemas/ManagerAmoID'
        initial_stage_id:
          $ref: '#/components/schemas/ManagerAmoID'
        validated_at:
          type: string
          format: date-time
      required:
      - revision
      - source_account_id
      - binding_revision
      - metadata_generation_id
      - pipeline_id
      - initial_stage_id
      - validated_at
    ManagerProductCompanyWorkflow:
      type: object
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
        version:
          $ref: '#/components/schemas/ManagerVersion'
        configuration:
          anyOf:
          - $ref: '#/components/schemas/ManagerCompanyWorkflowConfiguration'
          - type: 'null'
        write_ready:
          type: boolean
          enum:
          - false
      required:
      - product_id
      - version
      - configuration
      - write_ready
    ManagerSetProductCompanyWorkflow:
      type: object
      additionalProperties: false
      properties:
        source_account_id:
          $ref: '#/components/schemas/ManagerAmoID'
        binding_revision:
          type: string
          minLength: 1
          maxLength: 256
        metadata_generation_id:
          type: string
          format: uuid
        pipeline_id:
          $ref: '#/components/schemas/ManagerAmoID'
        initial_stage_id:
          $ref: '#/components/schemas/ManagerAmoID'
      required:
      - source_account_id
      - binding_revision
      - metadata_generation_id
      - pipeline_id
      - initial_stage_id

  responses:
    ManagerPlatformRateLimited:
      description: The Platform request is rate limited.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ManagerPlatformUnavailable:
      description: Live Platform data is unavailable.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Unauthenticated:
      description: Authentication required or failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: CSRF check failed or permission denied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidArgument:
      description: Request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Resource already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many login attempts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
