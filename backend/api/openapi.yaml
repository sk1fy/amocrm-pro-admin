    get:
      tags: [Accounts]
      operationId: getAccountCRMUsers
      summary: amoCRM users of an account read through capable backends.
      description: |
        Each backend with the `crm-users` capability reads amoCRM through the
        process that owns amoCRM traffic and keeps its own short snapshot.
        Admin API neither caches nor polls. A failed amoCRM read is a
        `data.state` with `users: null`; a failed backend is a source with
        status `unavailable`. Empty `items` means no capable source knows the
        account, never an account without users. Contact fields, groups and
        rights are not part of the contract.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: CRM users observations; empty when no source knows the account.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              description: Always `no-store`.
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CRMUsersList'
