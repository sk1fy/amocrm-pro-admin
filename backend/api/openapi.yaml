components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: admin_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    Command:
      name: command
      in: path
      required: true
      schema: {type: string}
    DeliveryID:
      name: delivery_id
      in: path
      required: true
      schema: {type: string, format: uuid}

    RequestID:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    RequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: Must equal `admin-ui` for POST, PATCH, PUT and DELETE.
      schema:
        type: string
        enum: [admin-ui]
    Origin:
      name: Origin
      in: header
      required: true
      description: Must equal `ADMIN_PUBLIC_ORIGIN` (trailing slash ignored).
      schema:
        type: string
        format: uri
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    AccountID:
      name: account_id
      in: path
      required: true
      schema:
        type: string
    Backend:
      name: backend
      in: path
      required: true
      schema:
        type: string
    ConnectionID:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
    IntegrationID:
      name: integration_id
      in: path
      required: true
      schema:
        type: string
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    PanelID:
      name: panel_id
      in: path
      required: true
      schema:
        type: string
  headers:
    RequestID:
      schema:
        type: string
        format: uuid
  schemas:
    AdminOperation:
      type: object
      required: [id, employee_id, backend, target_type, target_id, command, state, result, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        employee_id: {type: string, format: uuid}
        backend: {type: string}
        target_type: {type: string}
        target_id: {type: string}
        command: {type: string}
        state: {type: string, enum: [accepted, pending, running, succeeded, failed, partial, unknown_outcome]}
        outcome: {type: string}
        result: {type: object, additionalProperties: true}
        error: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
        observed_at: {type: string, format: date-time, nullable: true}
    OperationEnvelope:
      type: object
      required: [operation]
      properties:
        operation: {$ref: '#/components/schemas/AdminOperation'}
    OperationList:
      type: object
      required: [items, next_cursor, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminOperation'}}
        next_cursor: {type: string, nullable: true}
        total: {type: integer, nullable: true}

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    CreateEmployeeRequest:
      type: object
      additionalProperties: false
      required: [email, name, role, password]
      properties:
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          minLength: 8
    PatchEmployeeRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/EmployeeStatus'
    Role:
      type: string
      enum: [viewer, operator, admin]
    EmployeeStatus:
      type: string
      enum: [active, disabled]
    Me:
      type: object
      additionalProperties: false
      required: [id, email, name, role, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
    Employee:
      type: object
      additionalProperties: false
      required: [id, email, name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required: [id, created_at, last_seen_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        revoke_reason:
          type: [string, 'null']
        ip:
          type: [string, 'null']
        user_agent:
          type: [string, 'null']
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, action, outcome, created_at, metadata]
      properties:
        id:
          type: integer
        employee_id:
          type: [string, 'null']
          format: uuid
        actor_email:
          type: [string, 'null']
        action:
          type: string
        object_type:
          type: [string, 'null']
        object_ref:
          type: [string, 'null']
        outcome:
          type: string
          enum: [ok, denied, failed]
        request_id:
          type: [string, 'null']
          format: uuid
        ip:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    EmployeeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
        next_cursor:
          type: [string, 'null']
        total:
          type: [integer, 'null']
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: [string, 'null']
        total:
          type: [integer, 'null']
    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          type: [string, 'null']
        total:
          type: [integer, 'null']
    OK:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    ObservationError:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    Observation:
      type: object
      required: [source, observed_at, freshness]
      properties:
        source: {type: string}
        observed_at: {type: string, format: date-time}
        freshness:
          type: string
          enum: [fresh, stale, unavailable, unknown]
        error:
          $ref: '#/components/schemas/ObservationError'
        data: {}
        raw: {type: string}
    SourceStatus:
      type: object
      required: [backend, status]
      properties:
        backend: {type: string}
        status:
          type: string
          enum: [available, degraded, unavailable, unknown]
        observed_at:
          type: [string, 'null']
          format: date-time
        error:
          $ref: '#/components/schemas/ObservationError'
    SourcedList:
      type: object
      required: [items, sources]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: [string, 'null']
        total:
          type: [integer, 'null']
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceStatus'
    AccountConnection:
      type: object
      required: [backend, connection_id, state]
      properties:
        backend: {type: string}
        connection_id: {type: string}
        integration_id: {type: string}
        integration_code: {type: string}
        state: {type: string}
        raw: {type: string}
    AccountListItem:
      type: object
      required: [account_id, domains, state, problems, origin, connections]
      properties:
        account_id: {type: string}
        domains:
          type: array
          items: {type: string}
        state: {type: string}
        problems:
          type: array
          items: {type: string}
        origin: {type: string}
        last_activity_at:
          type: [string, 'null']
          format: date-time
        connections:
          type: array
          items:
            $ref: '#/components/schemas/AccountConnection'
    AccountList:
      type: object
      required: [items, sources]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountListItem'
        next_cursor:
          type: [string, 'null']
        total:
          type: [integer, 'null']
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceStatus'
    AccountCard:
      type: object
      required: [account_id, domains, state, problems, origin, connections, sources]
      properties:
        account_id: {type: string}
        domains:
          type: array
          items: {type: string}
        state: {type: string}
        problems:
          type: array
          items: {type: string}
        origin: {type: string}
        last_activity_at:
          type: [string, 'null']
          format: date-time
        connections:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceStatus'
    ConnectionCard:
      type: object
      required: [backend, connection, authorization, webhook, grants, activity, activity_sync, recent_jobs, recent_audit]
      properties:
        backend: {type: string}
        connection:
          $ref: '#/components/schemas/Observation'
        authorization:
          $ref: '#/components/schemas/Observation'
        webhook:
          $ref: '#/components/schemas/Observation'
        grants:
          $ref: '#/components/schemas/Observation'
        activity:
          $ref: '#/components/schemas/Observation'
        activity_sync:
          $ref: '#/components/schemas/Observation'
        recent_jobs:
          $ref: '#/components/schemas/Observation'
        recent_audit:
          $ref: '#/components/schemas/Observation'
    CatalogProduct:
      type: object
      required: [code, display_name]
      properties:
        code: {type: string}
        display_name: {type: string}
    CatalogBackend:
      type: object
      required: [code, kind, display_name, products]
      properties:
        code: {type: string}
        kind: {type: string}
        display_name: {type: string}
        products:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProduct'
    Catalog:
      type: object
      required: [backends, products]
      properties:
        backends:
          type: array
          items:
            $ref: '#/components/schemas/CatalogBackend'
        products:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProduct'
    BackendList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        observability:
          type: object
          properties:
            grafana_base_url: {type: string}
            loki_base_url: {type: string}
    StatsList:
      type: object
      required: [items, period]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        period: {type: string}
    SavedView:
      type: object
      required: [id, section, name, params, columns, created_at, updated_at, shared]
      properties:
        id: {type: string, format: uuid}
        owner_employee_id: {type: string, format: uuid, nullable: true}
        section: {type: string, enum: [accounts, operations, stats]}
        name: {type: string}
        params: {type: object, additionalProperties: true}
        columns: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        shared: {type: boolean}
    ViewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SavedView'}
        next_cursor: {type: string, nullable: true}
        total: {type: integer, nullable: true}
    CreateViewRequest:
      type: object
      required: [section, name]
      properties:
        section: {type: string, enum: [accounts, operations, stats]}
        name: {type: string}
        params: {type: object, additionalProperties: true}
        columns: {type: array, items: {type: string}}
        shared: {type: boolean}
    PatchViewRequest:
      type: object
      properties:
        name: {type: string}
        params: {type: object, additionalProperties: true}
        columns: {type: array, items: {type: string}}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - unauthenticated
                - forbidden
                - not_found
                - invalid_argument
                - conflict
                - rate_limited
                - backend_unavailable
                - backend_timeout
                - internal
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
  responses:
    Unauthenticated:
      description: Authentication required or failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: CSRF check failed or permission denied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidArgument:
      description: Request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Resource already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many login attempts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
