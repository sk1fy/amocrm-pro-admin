      - snapshot_at
    ManagerOperation:
      type: object
      additionalProperties: false
      required: [id, state]
      properties:
        id: {type: string, format: uuid}
        state:
          type: string
          enum: [unknown_outcome, completed, rejected, platform_operation]
        operation:
          type: object
          additionalProperties: false
          required: [state, kind, target_id, created_at, updated_at]
          properties:
            state:
              type: string
              enum: [accepted, running, waiting_external, succeeded, failed, needs_review]
            kind: {type: string}
            target_id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            result_ref: {type: string, format: uuid}
            retry_after_seconds: {type: integer, minimum: 0}
      if:
        properties:
          state:
            const: platform_operation
      then:
        required: [operation]
      else:
        not:
          required: [operation]
    AdminOperation:
      type: object
      required: [id, employee_id, backend, target_type, target_id, command, state, result, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        employee_id: {type: string, format: uuid}
        backend: {type: string}
        target_type: {type: string}
        target_id: {type: string}
        command: {type: string}
        state: {type: string, enum: [accepted, pending, running, succeeded, failed, partial, unknown_outcome]}
        outcome: {type: string}
        result:
          type: object
          additionalProperties: true
          properties:
            assignment_state:
              type: string
              enum: [queued, prechecking, applying, confirming, outcome_unknown, succeeded, no_change, rejected, conflict, cancelled, unknown]
              description: Assignment outcome observed by distribution-reconcile; independent of command success.
            external_effect_state:
              type: string
              enum: [no_attempt, in_flight, unknown, settled]
            evidence:
              type: string
              enum: [no_request_sent, observed_state_only, response_and_observation, unknown]
        error: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
        observed_at: {type: string, format: date-time, nullable: true}
