      - items
      - next_cursor
      - snapshot_at
      - query_hash
    ManagerTrialPolicy:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - none
          - once
          - free
        duration_days:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - kind
      - duration_days
      description: The owner validates the selected verified rule. FREE uses free with null duration_days. Disabled
        uses none with null duration_days. TOP uses once with 90 days. PRO uses once with 7 or 14 days.
