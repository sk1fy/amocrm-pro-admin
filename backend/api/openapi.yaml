components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: admin_session
    managerSession:
      type: apiKey
      in: cookie
      name: manager_session
  parameters:
    ManagerStaffLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    ManagerOrigin:
      name: Origin
      in: header
      required: true
      description: Must equal MANAGERS_PUBLIC_ORIGIN (trailing slash ignored).
      schema:
        type: string
        format: uri
    ManagerIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ManagerIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]{0,15}"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    Command:
      name: command
      in: path
      required: true
      schema: {type: string}
    DeliveryID:
      name: delivery_id
