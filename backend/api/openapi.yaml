openapi: 3.1.0
info:
  title: amoCRM Admin API
  version: v1
  summary: Internal admin panel API.
  description: |
    Employee session API for the admin panel. Authenticate with the
    `admin_session` cookie. Mutating requests require `X-Requested-With: admin-ui`
    and `Origin` equal to `ADMIN_PUBLIC_ORIGIN`.
servers:
  - url: /
security:
  - adminSession: []
tags:
  - name: Auth
  - name: Me
  - name: Employees
  - name: Audit
  - name: Accounts
  - name: Connections
  - name: Integrations
  - name: Operations
  - name: Catalog
  - name: System
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Create an employee session.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: HttpOnly session cookie `admin_session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Session revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Current employee profile and permissions.
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Current employee.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me/sessions:
    get:
      tags: [Me]
      operationId: listMySessions
      summary: List the current employee's sessions.
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Session list without token hashes.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me/sessions/{id}:
    delete:
      tags: [Me]
      operationId: revokeMySession
      summary: Revoke one of the current employee's sessions.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Session revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/system/employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: List employees.
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Employee list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Employees]
      operationId: createEmployee
      summary: Create an employee.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Employee created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/system/employees/{id}:
    patch:
      tags: [Employees]
      operationId: patchEmployee
      summary: Update an employee. Role or status changes revoke sessions.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEmployeeRequest'
      responses:
        '200':
          description: Employee updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/system/employees/{id}/sessions/revoke:
    post:
      tags: [Employees]
      operationId: revokeEmployeeSessions
      summary: Revoke all sessions of an employee.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Sessions revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/system/audit:
    get:
      tags: [Audit]
      operationId: listAdminAudit
      summary: List admin audit events.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: employee_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Search and list accounts aggregated from backends.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: q
          in: query
          schema: {type: string}
        - name: integration_id
          in: query
          description: OAuth integration ID; distinct from a product service code.
          schema: {type: string, format: uuid}
        - name: backend
          in: query
          schema: {type: string}
        - name: product
          in: query
          description: Catalog service code with an enabled grant.
          schema: {type: string}
        - name: connection
          in: query
          schema: {type: string}
        - name: problem
          in: query
          schema: {type: string}
        - name: origin
          in: query
          schema: {type: string}
        - name: sort
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Account list with source availability.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Account card with connection breakdown.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Account card.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCard'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/history:
    get:
      tags: [Accounts]
      operationId: getAccountHistory
      summary: Combined Core and admin audit for an account.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: History list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcedList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/jobs:
    get:
      tags: [Accounts]
      operationId: getAccountJobs
      summary: Jobs for all account connections, newest first, with per-source keyset pagination.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AccountID'
        - name: status
          in: query
          schema: {type: string}
        - name: type
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Job list; every item includes its backend code.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcedList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/connections/{backend}/{connection_id}:
    get:
      tags: [Connections]
      operationId: getConnection
      summary: Connection card with independent observations.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Backend'
        - $ref: '#/components/parameters/ConnectionID'
      responses:
        '200':
          description: Connection card.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionCard'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/connections/{backend}/{connection_id}/jobs:
    get:
      tags: [Connections]
      operationId: listConnectionJobs
      summary: Jobs of a connection.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Backend'
        - $ref: '#/components/parameters/ConnectionID'
        - name: status
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Job list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcedList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/connections/{backend}/{connection_id}/audit:
    get:
      tags: [Connections]
      operationId: listConnectionAudit
      summary: Core audit of a connection.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Backend'
        - $ref: '#/components/parameters/ConnectionID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcedList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/catalog:
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: Products and backends from the registry YAML.
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Catalog.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/integrations:
    get:
      tags: [Integrations]
      operationId: listIntegrations
      summary: Integrations from backends.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: backend
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Integration list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcedList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/integrations/{backend}/{integration_id}:
    get:
      tags: [Integrations]
      operationId: getIntegration
      summary: Integration card.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Backend'
        - $ref: '#/components/parameters/IntegrationID'
      responses:
        '200':
          description: Integration observation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/operations/jobs:
    get:
      tags: [Operations]
      operationId: listJobs
      summary: Jobs from backends.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: backend
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string}
        - name: type
          in: query
          schema: {type: string}
        - name: since
          in: query
          description: Lower bound of the job window, RFC 3339. Values older than 7 days are clamped to the retention window.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Job list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcedList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/operations/jobs/{backend}/{job_id}:
    get:
      tags: [Operations]
      operationId: getJob
      summary: Job with attempts.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Backend'
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Job observation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/system/backends:
    get:
      tags: [System]
      operationId: listBackends
      summary: Health observation of each backend.
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Backend health observations.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/connections/{backend}/{connection_id}/activity/settings:
    get:
      tags: [Connections]
      operationId: getActivitySettings
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Backend'
        - $ref: '#/components/parameters/ConnectionID'
      responses:
        '200':
          description: Activity settings observation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Observation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/connections/{backend}/{connection_id}/activity/status:
    get:
      tags: [Connections]
      operationId: getActivityStatus
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Backend'
        - $ref: '#/components/parameters/ConnectionID'
      responses:
        '200':
          description: Activity sync status observation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Observation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/connections/{backend}/{connection_id}/activity/panels:
    get:
      tags: [Connections]
      operationId: listActivityPanels
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Backend'
        - $ref: '#/components/parameters/ConnectionID'
      responses:
        '200':
          description: Activity panels observation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Observation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/connections/{backend}/{connection_id}/activity/panels/{panel_id}:
    get:
      tags: [Connections]
      operationId: getActivityPanel
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Backend'
        - $ref: '#/components/parameters/ConnectionID'
        - $ref: '#/components/parameters/PanelID'
      responses:
        '200':
          description: Activity panel observation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Observation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
