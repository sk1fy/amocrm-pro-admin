          type: string
          description: |
            `ok` carries the list. `no_authorized_connection`, `auth_error`,
            `rate_limited`, `incomplete`, `network_error` and
            `internal_error` mean the list is unknown. A value unknown to
            the adapter is `unknown` with the original in `raw`.
          enum: [ok, no_authorized_connection, auth_error, rate_limited, incomplete, network_error, internal_error, unknown]
        raw: {type: string}
        connection:
          description: Installation the users were read through; null when none.
          type: [object, 'null']
          additionalProperties: false
          required: [id, integration_id, integration_code]
          properties:
            id: {type: string}
            integration_id: {type: string}
            integration_code: {type: string}
        fresh_until:
          description: End of the owner's snapshot lifetime; null unless `ok`.
          type: [string, 'null']
          format: date-time
        retry_after_seconds:
          description: amoCRM retry hint for `rate_limited`.
          type: [integer, 'null']
          minimum: 1
        users:
          description: Null unless `ok`; an empty array is an account without users.
          type: [array, 'null']
          maxItems: 1000
          items:
