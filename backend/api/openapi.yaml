openapi: 3.1.0
info:
  title: amoCRM Admin API
  version: v1
  summary: Internal admin panel API.
  description: |
    Employee session API for the admin panel. Authenticate with the
    `admin_session` cookie. Mutating requests require `X-Requested-With: admin-ui`
    and `Origin` equal to `ADMIN_PUBLIC_ORIGIN`.
servers:
  - url: /
security:
  - adminSession: []
tags:
  - name: Auth
  - name: Me
  - name: Employees
  - name: Audit
  - name: Accounts
  - name: Connections
  - name: Integrations
  - name: Operations
  - name: Catalog
  - name: System
paths:
  /api/v1/managers/staff:
    get:
      operationId: managerStaff
      security: [{managerSession: []}]
      x-manager-grant: staff.manage
      parameters:
        - $ref: '#/components/parameters/ManagerStaffLimit'
        - $ref: '#/components/parameters/Cursor'
        - name: search
          in: query
          schema: {type: string, maxLength: 200}
      responses:
        '200':
          description: Successful local Admin operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagerStaffPage'}
        default:
          $ref: '#/components/responses/InternalError'
    post:
      operationId: managerStaffCreate
      x-manager-grants: [staff.manage, identity.manage]
      description: Requires both staff.manage and identity.manage.
      security: [{managerSession: []}]
      x-manager-grant: staff.manage
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/ManagerOrigin'
        - $ref: '#/components/parameters/ManagerIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagerStaffCreateRequest'}
      responses:
        '201':
          description: Successful local Admin operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagerStaffCommandResult'}
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/managers/staff/grants:
    get:
      operationId: managerStaffGrants
      security: [{managerSession: []}]
      x-manager-grant: staff.manage
      responses:
        '200':
          description: Successful local Admin operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagerGrantCatalog'}
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/managers/staff/{id}:
    get:
      operationId: managerStaffMember
      security: [{managerSession: []}]
      x-manager-grant: staff.manage
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Successful local Admin operation.
          headers:
            ETag:
              description: Strong quoted manager grants version for If-Match.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagerStaffMember'}
        default:
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: managerStaffUpdate
      security: [{managerSession: []}]
      x-manager-grant: staff.manage
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/ManagerOrigin'
        - $ref: '#/components/parameters/ManagerIdempotencyKey'
        - $ref: '#/components/parameters/ManagerIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagerStaffUpdateRequest'}
      responses:
        '200':
          description: Successful local Admin operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagerStaffCommandResult'}
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/managers/staff/{id}/invitation/reissue:
    post:
      operationId: managerInvitationReissue
      x-manager-grants: [staff.manage, identity.manage]
      description: Requires both staff.manage and identity.manage.
      security: [{managerSession: []}]
      x-manager-grant: staff.manage
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/ManagerOrigin'
        - $ref: '#/components/parameters/ManagerIdempotencyKey'
        - $ref: '#/components/parameters/ManagerIfMatch'
      responses:
        '200':
          description: Successful local Admin operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagerStaffCommandResult'}
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/managers/staff/{id}/sessions/revoke:
    post:
      operationId: managerStaffSessionsRevoke
      x-manager-grants: [staff.manage, identity.manage]
      description: Requires both staff.manage and identity.manage.
      security: [{managerSession: []}]
      x-manager-grant: staff.manage
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/ManagerOrigin'
        - $ref: '#/components/parameters/ManagerIdempotencyKey'
      responses:
        '200':
          description: Successful local Admin operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagerStaffCommandResult'}
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/managers/auth/invitations/accept:
    post:
      operationId: managerInvitationAccept
      security: []
      parameters:
        - $ref: '#/components/parameters/ManagerIdempotencyKey'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/ManagerOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagerInvitationAcceptRequest'}
      responses:
        '200':
          description: Successful local Admin operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagerInvitationAccepted'}
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/managers/security/audit:
    get:
      operationId: managerSecurityAudit
      security: [{managerSession: []}]
      x-manager-grant: security.audit.read
      parameters:
        - $ref: '#/components/parameters/ManagerStaffLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Successful local Admin operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagerSecurityAuditPage'}
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/managers/auth/login:
    post:
      tags: [Auth]
      operationId: managerLogin
      summary: Create a manager session on the manager host.
      description: >-
        Unknown email, wrong password, disabled employee or missing manager grants return the same 401.
        Database or session persistence failures return a safe 500 with request_id.
        Rate limiting returns 429, including when the bounded limiter is full.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: HttpOnly session cookie `manager_session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerMe'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/managers/auth/logout:
    post:
      tags: [Auth]
      security:
        - managerSession: []
      operationId: managerLogout
      summary: Revoke the current manager session.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Session revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/managers/me:
    get:
      tags: [Me]
      security:
        - managerSession: []
      operationId: getManagerMe
      summary: Current employee and manager grants.
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Current employee.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerMe'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/managers/installations:
    get:
      operationId: listManagerInstallations
      tags: [Managers]
      security:
        - managerSession: []
      summary: List the live installation review queue.
      description: >-
        Requires clients.read on the manager host. A cursor belongs to the current
        actor, filters, sort, and limit. An expired or mismatched cursor must be
        discarded. Summary counts cover the entire filtered snapshot.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: review, in: query, schema: {type: string, enum: [reviewed, unreviewed]}}
        - {name: kind, in: query, schema: {type: string, enum: [install, reinstall]}}
        - {name: last_lifecycle_event, in: query, schema: {$ref: '#/components/schemas/ManagerInstallationLifecycleEvent'}}
        - {name: product_id, in: query, schema: {type: string, format: uuid}}
        - {name: line, in: query, schema: {type: string, enum: [FREE, TOP, PRO]}}
        - {name: activation, in: query, schema: {type: string, enum: [pending, activated, unavailable]}}
        - {name: access_state, in: query, schema: {type: string, enum: [active, inactive]}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: sort, in: query, schema: {type: string, enum: [installed_at, -installed_at]}}
      responses:
        '200':
          description: One page and the full filtered summary at snapshot_at.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagerInstallationList'}
        '400':
          description: Invalid query; details.code can be invalid_cursor or query_too_broad.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/ManagerPlatformRateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ManagerPlatformUnavailable'}
  /api/v1/managers/installations/{id}/crm-deal/retry:
    post:
      operationId: retryManagerInstallationDeal
      tags: [Managers]
      security: [{managerSession: []}]
      description: Requires clients.write and the manager Origin. If-Match carries the deal retry version.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/ID'
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"[1-9][0-9]{0,9}"$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '202':
          description: Retry scheduled or acceptance is still being verified.
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagerPlatformUnavailable'}
  /api/v1/managers/installations/{id}/review:
    put:
      operationId: setManagerInstallationReview
      tags: [Managers]
      security:
        - managerSession: []
      summary: Set the review mark on one installation episode.
      description: >-
        Requires clients.write and the manager Origin. On an unknown outcome
        read the owned operation or resubmit the original key, version, and
        body. Changing any of them is a new decision and requires a new key.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/RequestedWith'
        - name: Origin
          in: header
          required: true
          description: Must equal MANAGERS_PUBLIC_ORIGIN (trailing slash ignored).
          schema: {type: string, format: uri}
        - $ref: '#/components/parameters/ID'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"[1-9][0-9]{0,15}"$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reviewed]
              properties:
                reviewed: {type: boolean}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200':
          description: Authoritative installation and version after the command.
          headers:
            ETag:
              schema: {type: string, pattern: '^"[1-9][0-9]{0,15}"$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagerInstallation'}
        '202':
          description: The outcome is unknown; poll the operation at Location.
          headers:
            Location:
              schema: {type: string}
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, state]
                properties:
                  id: {type: string, format: uuid}
                  state: {type: string, enum: [unknown_outcome]}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            details.code can be idempotency_conflict or version_conflict.
            Only version_conflict can include details.current_version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: Command rejected by an installation review rule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429': {$ref: '#/components/responses/ManagerPlatformRateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ManagerPlatformUnavailable'}
  /api/v1/managers/accounts:
    get:
      operationId: listAccountsForManagers
      tags:
      - Managers
      security:
      - managerSession: []
      summary: List manager accounts.
      description: Requires clients.read on the manager host. Cursors are bound to the current actor and query. Totals
        cover the whole filtered snapshot.
      x-manager-grant: clients.read
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      - name: classification
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: product_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: license_before
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: active_users_min
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: active_users_max
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - amo_account_id
          - current_domain
          - display_name
          - license_until
          - -license_until
      responses:
        '200':
          description: List manager accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerAccountList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/ManagerPlatformRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ManagerPlatformUnavailable'
  /api/v1/managers/accounts/search:
    post:
      operationId: searchAccountsForManagers
      tags:
      - Managers
      security:
      - managerSession: []
      summary: Search manager accounts by portrait and account filters.
      description: Requires clients.read on the manager host. The manager Origin and X-Requested-With are required
        for this read. Cursors are bound to the current actor and query. Totals cover the whole filtered snapshot.
      x-manager-grant: clients.read
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/RequestedWith'
      - $ref: '#/components/parameters/ManagerOrigin'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      - name: classification
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: product_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: license_before
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: active_users_min
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: active_users_max
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - amo_account_id
          - current_domain
          - display_name
          - license_until
          - -license_until
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                portrait_filter:
                  $ref: '#/components/schemas/ManagerPortraitFilter'
              required:
              - portrait_filter
      responses:
        '200':
          description: Search manager accounts by portrait and account filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerAccountList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/ManagerPlatformRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ManagerPlatformUnavailable'
  /api/v1/managers/accounts/{id}:
    get:
      operationId: getAccountForManagers
      tags:
      - Managers
      security:
      - managerSession: []
      summary: Read a manager account.
      description: Requires clients.read on the manager host.
      x-manager-grant: clients.read
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Read a manager account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerAccountDetail'
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/ManagerPlatformRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ManagerPlatformUnavailable'
  /api/v1/managers/accounts/{id}/profile:
    patch:
      operationId: updateAccountProfileForManagers
      tags:
      - Managers
      security:
      - managerSession: []
      summary: Update the account profile.
      description: Requires clients.write on the manager host.
      x-manager-grant: clients.write
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/RequestedWith'
      - $ref: '#/components/parameters/ManagerOrigin'
      - $ref: '#/components/parameters/ManagerIdempotencyKey'
      - $ref: '#/components/parameters/ManagerIfMatch'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name:
                  type:
                  - string
                  - 'null'
                note:
                  type:
                  - string
                  - 'null'
                classification:
                  type:
                  - string
                  - 'null'
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
              required:
              - reason
      responses:
        '200':
          description: Update the account profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerAccountDetail'
          headers:
            ETag:
              schema:
                type: string
        '202':
          description: Poll the owned command at Location. The state is unknown_outcome until the outcome is known.
          headers:
            Location:
              schema:
                type: string
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerOperation'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/ManagerPlatformRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ManagerPlatformUnavailable'
        '409':
          description: >-
            details.code is idempotency_conflict, version_conflict or state_conflict.
            An applicable current version is numeric details.current_version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: The Platform business rule rejected the command. details.code is a safe public reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/managers/accounts/{id}/refresh:
    post:
      operationId: requestAccountRefreshForManagers
      tags:
      - Managers
      security:
      - managerSession: []
      summary: Request account observations.
