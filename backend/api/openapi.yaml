          minimum: 1
          maximum: 9007199254740991
          description: Owner-verified tariff selection. Null clears the selection. No tariff discovery API is available.
        trial_policy:
          $ref: '#/components/schemas/ManagerTrialPolicy'
        links:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              label:
                type: string
              url:
                type: string
                format: uri
            required:
            - label
            - url
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Product card concurrency version, independent of tariff_version.
      required:
      - id
      - code
      - display_name
      - line
      - availability
      - integration_refs
      - tariff_version
      - trial_policy
      - links
      - version
    ManagerProductCode:
      type: string
      maxLength: 63
      pattern: ^[a-z0-9]+(?:[-_][a-z0-9]+)*$
    ManagerProductList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
