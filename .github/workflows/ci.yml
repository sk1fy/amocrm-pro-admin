name: Admin checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-scripts:
    name: Documentation and script safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test backup and restore safety without a database
        run: make scripts-test
      - name: Check documentation links
        run: make docs-check

  application:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [lint, test, integration-test, e2e]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Run canonical Docker check
        run: make COMPOSE="docker compose" ${{ matrix.target }}
