# Backend registry for admin-api. Committed without secrets: each backend
# names the environment variable that holds its service token.
# Contract: docs/design/backend-adapter.md (v1).
#
# `fixture` is the labelled test backend that proves the adapter contract with
# synthetic data (every response is marked origin=fixture and must be shown as
# test data). Removing or disabling this entry must not affect `core`: partial
# availability keeps core data readable and reports only the fixture source as
# unavailable.
version: 1
backends:
  - code: core
    kind: core-http
    display_name: "Core (amocrm-pro)"
    # Development: admin listener of the amocrm-pro pilot stack published on the
    # host loopback (ACTIVITY_ADMIN_PORT, default 18083). From inside the admin
    # compose network the host is reachable as host.docker.internal.
    base_url: http://host.docker.internal:18083
    token_env: CORE_ADMIN_API_TOKEN
    timeout: 5s
    health_path: /admin/v1/backend
    products:
      - code: lead-status
        display_name: "Статусы сделок"
      - code: activity
        display_name: "Активность сотрудников"
  - code: fixture
    kind: fixture
    profile: module
    display_name: "Fixture module (тестовые данные)"
    timeout: 2s
    products:
      - code: fixture-module
        display_name: "Демонстрационный модуль"
